[package]
name = "cpx"
version = "0.1.0"
edition = 17

[lib]
mod = ["src/*.cppm"]

[dependencies]
pfr = { version = "?1.88.0", optional = true }
magic_enum = { version = "?0.9.7", optional = true  }
fmt = { version = "?12.1.0", optional = true  }
cli = { version = "?2.6.2", optional = true  }
yyjson = { version = "?0.12.0", optional = true  }
nlohmann-json = { version = "?3.12.0", optional = true  }
toml = { version = "?4.4.0", optional = true  }
yaml = { version = "?0.9.0", optional = true  }
spdlog = { version = "?1.15.3", default-features = false, optional = true }

fmt-mod = { mod = ["src/third_parties/fmt.cppm"], optional = true }
cli-mod = { mod = ["src/third_parties/cli11.cppm"], optional = true }
yyjson-mod = { mod = ["src/third_parties/yy_json.cppm"], optional = true }
nlohmann-json-mod = { mod = ["src/third_parties/nlohmann_json.cppm"], optional = true }
toml-mod = { mod = ["src/third_parties/toruniina_toml.cppm"], optional = true }
yaml-mod = { mod = ["src/third_parties/jbeder_yaml.cppm"], optional = true }

[features]
fmt = ["dep:fmt", "dep:fmt-mod"]
cli = ["dep:cli", "dep:cli-mod"]
json = ["yyjson"]
toml = ["dep:toml", "dep:toml-mod"]
yaml = ["dep:yaml", "dep:yaml-mod"]

yyjson = ["dep:yyjson", "dep:yyjson-mod"]
nlohmann-json = ["dep:nlohmann-json", "dep:nlohmann-json-mod"]
spdlog = ["fmt", "dep:spdlog"]
